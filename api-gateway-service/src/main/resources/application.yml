server:
  port: 8080

spring:
  application:
    name: api-gateway-service

  # Spring Data Redis Reactive (Lettuce Non-blocking driver)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
        shutdown-timeout: 100ms

  # Spring Security OAuth2 Resource Server for Keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/master/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/master}

  # Spring Cloud Gateway Routing Configuration
  cloud:
    gateway:
      routes:
        # Route 1: Keycloak Auth Endpoint (Proxy or direct pass-through)
        - id: keycloak-auth-route
          uri: ${KEYCLOAK_URI:http://localhost:8180}
          predicates:
            - Path=/realms/**, /resources/**
          filters:
            - AddRequestHeader=X-Gateway-Name, api-gateway-service

        # Route 2: User Microservice
        - id: user-service-route
          uri: ${USER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - AddRequestHeader=X-Gateway-Name, api-gateway-service

        # Route 3: Order Microservice
        - id: order-service-route
          uri: ${ORDER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - AddRequestHeader=X-Gateway-Name, api-gateway-service

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

# Custom JWT & Keycloak Blacklist Properties
jwt:
  # Keycloak JWKS & Realm settings
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
  issuer-uri: ${KEYCLOAK_ISSUER_URI:}
  # Secret key fallback for HMAC (HS256) environments
  secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  # Redis Key prefix for blacklisted token IDs
  blacklist-prefix: "jwt:blacklist:"
  # Whitelisted public paths that bypass JWT Blacklist verification
  excluded-paths:
    - /realms/**
    - /resources/**
    - /api/v1/auth/**
    - /actuator/health
    - /actuator/info

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.example.gateway.filter: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
