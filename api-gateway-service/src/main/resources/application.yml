server:
  port: 8080

spring:
  application:
    name: api-gateway-service

  # Reactive Lettuce Redis configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 1000ms
        shutdown-timeout: 100ms

  # Spring Cloud Gateway Routing Configuration
  cloud:
    # Spring Cloud LoadBalancer Caching & Discovery Configuration
    loadbalancer:
      cache:
        enabled: true
        ttl: 30s
        capacity: 256
        caffeine:
          spec: initialCapacity=50,maximumSize=500,expireAfterWrite=30s
      health-check:
        refetch-instances: true
        repeat-health-check: true
        interval: 15s

    # Default static instances for standalone development / Docker environments
    # (Automatically overridden when Eureka/Consul/K8s discovery is active)
    discovery:
      client:
        simple:
          instances:
            user-service:
              - uri: ${USER_SERVICE_INSTANCE_1:http://localhost:8081}
              - uri: ${USER_SERVICE_INSTANCE_2:http://localhost:8083}
            order-service:
              - uri: ${ORDER_SERVICE_INSTANCE_1:http://localhost:8082}
              - uri: ${ORDER_SERVICE_INSTANCE_2:http://localhost:8084}
            resource-service:
              - uri: ${RESOURCE_SERVICE_INSTANCE_1:http://localhost:8082}

    gateway:
      routes:
        # Route 1: Keycloak Auth Endpoint (Proxy or direct pass-through)
        - id: keycloak-auth-route
          uri: ${KEYCLOAK_URI:http://localhost:8180}
          predicates:
            - Path=/realms/**, /resources/**

        # Route 2: User Microservice (LoadBalanced via Spring Cloud LoadBalancer)
        - id: user-service-route
          uri: ${USER_SERVICE_URI:lb://user-service}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        # Route 3: Order Microservice (LoadBalanced via Spring Cloud LoadBalancer)
        - id: order-service-route
          uri: ${ORDER_SERVICE_URI:lb://order-service}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderServiceCircuitBreaker
                fallbackUri: forward:/fallback/order-service

        # Route 4: Resource Microservice (LoadBalanced via Spring Cloud LoadBalancer)
        - id: resource-service-route
          uri: ${RESOURCE_SERVICE_URI:lb://resource-service}
          predicates:
            - Path=/api/v1/resources/**
          filters:
            - name: CircuitBreaker
              args:
                name: resourceServiceCircuitBreaker
                fallbackUri: forward:/fallback/resource-service

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"

# Unified Gateway Security Configuration
gateway:
  security:
    keycloak:
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/master/protocol/openid-connect/certs}
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/master}
    blacklist:
      enabled: true
      prefix: "jwt:blacklist:"
      timeout-ms: 800
    excluded-paths:
      - /realms/**
      - /resources/**
      - /api/v1/auth/**
      - /actuator/**
      - /fallback/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.example.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
