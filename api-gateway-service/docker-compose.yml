version: '3.8'

services:
  # 1. Keycloak Identity and Access Management
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak-server
    command: start-dev --http-port=8180
    ports:
      - "8180:8180"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8180;echo -e \"GET /health/ready HTTP/1.1\\r\\nhost: localhost:8180\\r\\nConnection: close\\r\\n\\r\\n\" >&3;grep \"HTTP/1.1 200 OK\" <&3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Server (High performance store for revoked JWTs)
  redis:
    image: redis:7.4-alpine
    container_name: redis-gateway
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Downstream Microservice Simulation (e.g., User Service)
  user-service:
    image: kennethreitz/httpbin
    container_name: mock-user-service
    ports:
      - "8081:80"

  # 4. Spring Cloud Gateway Service (Integrated with Keycloak & Redis Blacklist)
  api-gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway-service
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8180/realms/master/protocol/openid-connect/certs
      - KEYCLOAK_ISSUER_URI=http://keycloak:8180/realms/master
      - KEYCLOAK_URI=http://keycloak:8180
      - USER_SERVICE_URI=http://user-service:80
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
